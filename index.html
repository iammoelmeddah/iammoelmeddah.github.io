<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mo el meddah | قريبـاً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #070d1d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        /* --- تأثير خلفية الفضاء والنجوم المتحركة --- */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #00d4ff;
            border-radius: 50%;
            animation: starPulse 3.5s infinite ease-in-out;
        }

        .star:nth-child(1) { top: 15%; left: 15%; width: 2px; height: 2px; animation-delay: 0s; }
        .star:nth-child(2) { top: 25%; left: 85%; width: 3px; height: 3px; animation-delay: 1s; }
        .star:nth-child(3) { top: 60%; left: 10%; width: 2.5px; height: 2.5px; animation-delay: 0.5s; }
        .star:nth-child(4) { top: 80%; left: 80%; width: 3px; height: 3px; animation-delay: 2s; }
        .star:nth-child(5) { top: 35%; left: 50%; width: 4px; height: 4px; animation-delay: 1.5s; }

        @keyframes starPulse {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 10px #00d4ff; }
        }

        /* توهج خلفي جمالي */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, rgba(7, 13, 29, 0) 70%);
            top: -150px;
            right: -150px;
            z-index: 0;
            animation: bgGlow 8s infinite alternate ease-in-out;
        }

        .header-spacer { height: 1px; }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2.5rem 1rem;
            max-width: 750px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        /* --- أنيميشن الصورة الشخصية (بدون تعديل أبعادها أو شكلها الأصلي) --- */
        .profile-container {
            position: relative;
            margin-bottom: 0.5rem;
            animation: floatImage 4s infinite ease-in-out;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.25);
            display: block;
        }

        /* تأثير هالة خفيفة ونظيفة تحت الصورة */
        .profile-container::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, transparent, #00d4ff);
            z-index: -1;
            opacity: 0.5;
            animation: rotateGlow 6s linear infinite;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.08);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.25);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: slideUp 0.6s ease-out 0.3s forwards;
        }

        .intro-text {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 400;
            opacity: 0;
            animation: slideUp 0.6s ease-out 0.4s forwards;
        }

        /* --- الاسم بحجم أكبر وبروز احترافي --- */
        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #ffffff;
            line-height: 1.1;
            opacity: 0;
            animation: slideUp 0.6s ease-out 0.5s forwards;
        }

        h1 span { 
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.35);
        }

        p {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.8;
            max-width: 580px;
            opacity: 0;
            animation: slideUp 0.6s ease-out 0.6s forwards;
        }

        /* --- أيقونات التواصل الاجتماعي --- */
        .social-icons {
            display: flex;
            gap: 14px;
            margin-top: 5px;
            opacity: 0;
            animation: slideUp 0.6s ease-out 0.7s forwards;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00d4ff;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-icon:hover {
            background: #00d4ff;
            color: #070d1d;
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
            border-color: #00d4ff;
        }

        .loader-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.8s forwards;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00d4ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        .footer-note {
            position: relative;
            z-index: 1;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding: 1.5rem 0;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease-in 1s forwards;
        }

        /* --- الحركات والأنيميشن الاحترافية --- */
        @keyframes fadeIn { to { opacity: 1; } }
        
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes floatImage {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes rotateGlow {
            to { transform: rotate(360deg); }
        }

        @keyframes bgGlow { 
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.15); opacity: 0.6; } 
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .profile-img { width: 130px; height: 130px; }
            p { font-size: 0.95rem; padding: 0 1rem; }
        }
    </style>
</head>
<body>

    <!-- خلفية النجوم المتحركة -->
    <div class="stars-bg">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <div class="header-spacer"></div>

    <div class="container">
        <!-- الصورة الشخصية مع حركة عائمة خفيفة -->
        <div class="profile-container">
            <img src="https://pbs.twimg.com/profile_images/2087289185715867648/iRKwRxK__400x400.jpg" alt="mo el meddah" class="profile-img">
        </div>

        <div class="badge">قريباً جداً</div>
        
        <div class="intro-text">مرحباً، أنا</div>
        <h1><span>mo el meddah</span></h1>

        <p>أعمل حالياً على تطوير وهندسة تجربة رقمية جديدة كلياً لتظهر بأفضل شكل ممكن. ابقوا على تواصل، فما تخطط له قادم بقوة.</p>
        
        <!-- أيقونات التواصل الاجتماعي -->
        <div class="social-icons">
            <a href="#" class="social-icon" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" class="social-icon" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="social-icon" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
        </div>

        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="footer-note">
        جميع الحقوق محفوظة © 2026
    </div>

</body>
</html>
