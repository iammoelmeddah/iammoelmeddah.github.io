<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mo el meddah | قريبـاً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية جمالية خفيفة */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, rgba(11, 19, 43, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        /* مساحة فارغة في الأعلى لتحقيق التوازن البصري */
        .header-spacer {
            height: 1px;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: #00d4ff;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        .loader-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #00d4ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .footer-note {
            position: relative;
            z-index: 1;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem 0;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- مساحة علوية -->
    <div class="header-spacer"></div>

    <div class="container">
        <div class="badge">قريباً جداً</div>
        <h1>مرحباً، أنا <span>mo el meddah</span></h1>
        <p>أعمل حالياً على تطوير وهندسة تجربة رقمية جديدة كلياً لتظهر بأفضل شكل ممكن. ابقوا على تواصل، فما تخطط له قادم بقوة.</p>
        
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- الفوتر في الأسفل دائماً -->
    <div class="footer-note">
        جميع الحقوق محفوظة © 2026
    </div>

</body>
</html>
