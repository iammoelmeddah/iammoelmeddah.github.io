<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mo El Meddah | قريباً</title>
    <!-- خط Cairo الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00bcd4; /* اللون السيان المضيء */
            --bg-color: #ffffff;     /* الأبيض النقي */
            --text-dark: #1e293b;     /* رمادي غامق جداً للنصوص */
            --text-light: #64748b;    /* رمادي متوسط */
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            background-size: 400% 400%;
        }

        .header-spacer { height: 1px; }

        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 2rem;
            max-width: 750px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            opacity: 0;
            animation: pageLoadIn 1s ease-out forwards;
        }

        @keyframes pageLoadIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- تصميم الصورة الشخصية (تدحرج ذهاباً وإياباً) --- */
        .profile-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .profile-img-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, var(--primary-color), #ffffff, var(--primary-color));
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 40px -10px rgba(0, 188, 212, 0.3);
            /* تطبيق أنيميشن التدحرج الجديد */
            animation: rollHead 4s ease-in-out infinite;
        }

        /* تعريف حركة التدحرج 33 درجة يميناً ويساراً */
        @keyframes rollHead {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(33deg); }
            75% { transform: rotate(-33deg); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-color);
        }

        /* تأثير النبض خلف الصورة */
        .profile-wrapper::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulseRing 2s infinite;
            z-index: 1;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* --- النصوص والعناصر --- */

        /* نقلنا ستايل المربع إلى "مرحباً أنا" وتم حذف "قريباً جداً" */
        .framed-badge {
            display: inline-block;
            background: var(--primary-color);
            color: #ffffff;
            padding: 8px 25px; /* تكبير الحشوة قليلاً */
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.3s forwards;
        }

        .intro-text {
            font-size: 1.2rem;
            color: var(--text-light);
            font-weight: 400;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.4s forwards;
            margin-bottom: -0.5rem; /* لتقليل المسافة مع الاسم */
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.1;
            letter-spacing: -1px;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.5s forwards;
        }

        /* الاسم بأول حروف كابيتال */
        h1 span {
            color: var(--primary-color);
        }

        p {
            color: var(--text-light);
            font-size: 1.1rem;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.6s forwards;
        }

        /* --- أيقونات التواصل الاجتماعي (في صف واحد) --- */
        .social-links {
            display: flex;
            justify-content: center; /* توسيط الأيقونات */
            gap: 20px; /* مسافة بين الأيقونات */
            margin-top: 1rem;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.7s forwards;
            width: 100%;
        }

        .social-icon {
            width: 50px; /* تكبير الأيقونات قليلاً */
            height: 50px;
            background: #f1f5f9;
            color: var(--text-light);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }

        .social-icon:hover {
            background: var(--primary-color);
            color: #ffffff;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 188, 212, 0.3);
            border-color: transparent;
        }

        /* --- الفوتر السفلي --- */
        footer {
            position: relative;
            z-index: 1;
            font-size: 0.85rem;
            color: var(--text-light);
            padding: 2rem 1rem;
            width: 100%;
            text-align: center;
            border-top: 1px solid #f1f5f9;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            opacity: 0;
            animation: fadeIn 1s ease-in 1s forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .profile-img-container { width: 130px; height: 130px; }
            .main-container { padding: 2rem 1rem; }
            p { font-size: 1rem; }
            .social-icon { width: 40px; height: 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="header-spacer"></div>

    <div class="main-container">
        <!-- الصورة الشخصية (تتدحرج الآن) -->
        <div class="profile-wrapper">
            <div class="profile-img-container">
                <img src="https://pbs.twimg.com/profile_images/2087289185715867648/iRKwRxK__400x400.jpg" alt="Mo El Meddah" class="profile-img">
            </div>
        </div>

        <!-- المربع أصبح هنا -->
        <div class="framed-badge">مرحباً، أنا</div>
        
        <!-- تم حذف "قريباً جداً" -->
        
        <!-- الاسم بأول حروف كابيتال -->
        <h1>Mo El <span>Meddah</span></h1>

        <p>أعمل حالياً على هندسة وتطوير تجربتي الرقمية الجديدة. ترقبوا شيئاً مميزاً واحترافياً للغاية.</p>
        
        <!-- أيقونات التواصل الاجتماعي (في صف واحد) -->
        <div class="social-links">
            <a href="#" class="social-icon" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" class="social-icon" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="social-icon" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 | تصميم وتطوير Mo El Meddah
    </footer>

</body>
</html>
