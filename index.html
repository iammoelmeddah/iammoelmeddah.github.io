<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mo El Meddah | مطور واجهات ومصمم UI/UX</title>
    <!-- خط Cairo الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&amp;display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00bcd4; /* اللون السيان المضيء */
            --bg-color: #f8fafc;     /* خلفية الصفحة العامة الفاتحة */
            --text-dark: #1e293b;     /* رمادي غامق للنصوص */
            --text-light: #64748b;    /* رمادي متوسط */
            --card-bg: #ffffff;       /* خلفية الحاويات */
            --navbar-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
            --btn-bg-light: #f1f5f9;  /* خلفية الأزرار الافتراضية الرمادية */
        }

        /* --- دعم الدارك مود (الوضع الليلي) --- */
        body.dark-mode {
            --bg-color: #0f172a;
            --text-dark: #f8fafc;
            --text-light: #94a3b8;
            --card-bg: #1e293b;
            --navbar-bg: rgba(15, 23, 42, 0.95);
            --border-color: #334155;
            --btn-bg-light: #334155; /* خلفية الأزرار في الدارك مود */
            background: linear-gradient(135deg, #0f172a 0%, #090d16 100%) !important;
        }

        body.dark-mode .main-container { background: var(--card-bg); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); }
        body.dark-mode footer { background: rgba(15, 23, 42, 0.9); }
        body.dark-mode .social-icon { background: #1e293b; color: var(--text-light); border-color: var(--border-color); }
        body.dark-mode .nav-item, body.dark-mode .nav-action-btn { background-color: var(--btn-bg-light); color: var(--text-dark); }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding-top: 50px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- القائمة العلوية --- */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 0 1rem;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .nav-container {
            max-width: 750px;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto;
        }

        /* القائمة في اليمين */
        .nav-links {
            display: flex;
            gap: 6px;
            list-style: none;
        }

        /* تصميم موحد لجميع عناصر شريط التنقل (بدون بوردر، خلفية رمادية، هوفر باللون الرئيسي) */
        .nav-item, .nav-action-btn {
            background: var(--btn-bg-light);
            border: none;
            color: var(--text-light);
            height: 32px;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            outline: none;
        }

        .nav-item:hover, .nav-action-btn:hover {
            background: var(--primary-color) !important;
            color: #ffffff !important;
        }

        /* الأزرار في اليسار */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-action-btn i {
            font-size: 0.95rem; /* تكبير الأيقونات لتتطابق مع البقية */
        }

        /* --- أنيميشن الخلفية --- */
        .background-animation {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ray {
            position: absolute;
            top: -150px;
            width: 2px;
            height: 150px;
            background: linear-gradient(to bottom, transparent, var(--primary-color), transparent);
            animation: fallRay 6s linear infinite;
            opacity: 0.6;
        }

        .ray:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 5s; }
        .ray:nth-child(2) { left: 35%; animation-delay: 2s; animation-duration: 7s; }
        .ray:nth-child(3) { left: 75%; animation-delay: 1s; animation-duration: 6s; }
        .ray:nth-child(4) { left: 95%; animation-delay: 3s; animation-duration: 8s; }

        @keyframes fallRay {
            0% { transform: translateY(0) scaleY(1); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(110vh) scaleY(1.5); opacity: 0; }
        }

        .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-color);
            animation: blinkDot 4s ease-in-out infinite;
        }

        .dot:nth-child(5) { top: 10%; left: 20%; animation-delay: 0.5s; }
        .dot:nth-child(6) { top: 30%; left: 80%; animation-delay: 1.5s; }
        .dot:nth-child(7) { top: 60%; left: 15%; animation-delay: 2.5s; }
        .dot:nth-child(8) { top: 90%; left: 75%; animation-delay: 1s; }

        @keyframes blinkDot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* --- الحاوية الرئيسية --- */
        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 750px;
            width: 90%;
            margin: 30px auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 2.5rem;
            opacity: 0;
            animation: pageLoadIn 1s ease-out forwards;
            transition: background 0.3s ease;
        }

        @keyframes pageLoadIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-cover {
            width: 100%;
            height: 220px;
            position: relative;
            margin-top: 0;
            background-image: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .profile-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.4));
        }

        .profile-wrapper {
            position: relative;
            margin-top: -75px;
            margin-bottom: 1rem;
            z-index: 2;
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            padding: 5px;
            background: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: rollHead 4s ease-in-out infinite;
            transition: background 0.3s ease;
        }

        @keyframes rollHead {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }

        .content-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            padding: 0 2rem;
            width: 100%;
        }

        .framed-badge {
            display: inline-block;
            background: var(--primary-color);
            color: #ffffff;
            padding: 6px 20px;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(0, 188, 212, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.1;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--primary-color);
        }

        p {
            color: var(--text-light);
            font-size: 1.02rem;
            line-height: 1.8;
            max-width: 580px;
            margin: 0 auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 0.5rem;
            width: 100%;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            background: #f1f5f9;
            color: var(--text-light);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .social-icon:hover {
            background: var(--primary-color);
            color: #ffffff;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 188, 212, 0.3);
            border-color: transparent;
        }

        footer {
            position: relative;
            z-index: 1;
            font-size: 0.85rem;
            color: var(--text-light);
            padding: 1.2rem;
            width: 100%;
            text-align: center;
            background: var(--navbar-bg);
            border-top: 1px solid var(--border-color);
            margin-top: 30px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.3rem; }
            .profile-img-container { width: 120px; height: 120px; }
            .profile-cover { height: 160px; }
            .profile-wrapper { margin-top: -60px; }
            .main-container { width: 95%; margin: 20px auto; }
            .content-body { padding: 0 1rem; }
            p { font-size: 0.92rem; }
            .social-icon { width: 42px; height: 42px; font-size: 1.1rem; }
            .top-navbar { padding: 0 1rem; }
            .nav-links { gap: 4px; }
            .nav-item, .nav-action-btn { padding: 0 8px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="top-navbar">
        <div class="nav-container">
            <!-- القائمة في اليمين -->
            <ul class="nav-links">
                <li><a href="#" class="nav-item">الرئيسية</a></li>
                <li><a href="#" class="nav-item">عني</a></li>
                <li><a href="#" class="nav-item">تواصل</a></li>
            </ul>

            <!-- الأزرار في اليسار -->
            <div class="nav-left">
                <!-- زر اللغة الطبيعي مع الأيقونة والاسم -->
                <button class="nav-action-btn" title="تغيير اللغة">
                    <i class="fas fa-globe"></i>
                    <span>English</span>
                </button>

                <!-- زر الوضع الليلي -->
                <button class="nav-action-btn" id="darkModeToggle" title="تبديل الوضع الليلي">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="background-animation">
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="main-container">
        <div class="profile-cover"></div>

        <div class="profile-wrapper">
            <div class="profile-img-container">
                <img src="https://pbs.twimg.com/profile_images/2087289185715867648/iRKwRxK__400x400.jpg" alt="Mo El Meddah" class="profile-img">
            </div>
        </div>

        <div class="content-body">
            <div class="framed-badge">مرحباً، أنا</div>
            
            <h1>Mo El <span>Meddah</span></h1>

            <p>مطور واجهات أمامية ومصمم جرافيك متخصص في تصميم واجهات وتجربة المستخدم (UI/UX)، أعمل على بناء وتطوير المواقع والمدونات المخصصة للشركات والأفراد مع التركيز على دقة التصميم وسلاسة الأداء.</p>
            
            <div class="social-links">
                <a href="https://github.com/iammoelmeddah" class="social-icon" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/iammoelmeddah" class="social-icon" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://instagram.com/iammoelmeddah" class="social-icon" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://twitter.com/iammoelmeddah" class="social-icon" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 | تصميم وتطوير Mo El Meddah
    </footer>

    <!-- سكريبت الوضع الليلي -->
    <script>
        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const icon = darkModeToggle.querySelector('i');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });
    </script>


</body></html>
